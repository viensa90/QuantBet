# Configuración general de QuantBet
version: "0.2.0"

# Configuración del conector
connector:
  type: "csv"  # opciones: "csv", "web"
  
# Configuración CSV (para pruebas)
csv:
  file_path: "data/sample_events.csv"

# Configuración Web Scraping
web_scraping:
  headless: true
  timeout: 30000  # milisegundos
  bookmakers:
    bet365:
      url: "https://www.bet365.es/"
      selectors:
        "Local": ".odds-local-class"
        "Empate": ".odds-draw-class"
        "Visitante": ".odds-away-class"
      events:
        - id: "EVT-001"
          name: "Real Madrid vs Barcelona"
          url: "https://www.bet365.es/event/12345"
          market_type: "1X2"
        - id: "EVT-002"
          name: "Bayern vs Dortmund"
          url: "https://www.bet365.es/event/67890"
          market_type: "1X2"
    
    william_hill:
      url: "https://www.williamhill.es/"
      selectors:
        "Local": ".wh-odds-home"
        "Empate": ".wh-odds-draw"
        "Visitante": ".wh-odds-away"
      events:
        - id: "EVT-001"
          name: "Real Madrid vs Barcelona"
          url: "https://www.williamhill.es/event/12345"
          market_type: "1X2"

# Mercados habilitados
markets:
  enabled:
    - "1X2"
    - "OVER_UNDER"
    - "ASIAN_HANDICAP"
    - "DOUBLE_CHANCE"
  # Configuración específica por mercado
  over_under:
    default_line: 2.5
  asian_handicap:
    default_handicap: 0.0

# Modelo de probabilidades
probability_model:
  type: "historical"  # opciones: "historical", "elo"
  # Datos históricos (opcional)
  historical_data:
    teams:
      Real Madrid:
        home_win_rate: 0.70
        draw_rate: 0.20
        away_win_rate: 0.10
        goals_scored_avg: 2.10
        goals_conceded_avg: 0.90
        strength: 0.85
      Barcelona:
        home_win_rate: 0.65
        draw_rate: 0.25
        away_win_rate: 0.10
        goals_scored_avg: 2.00
        goals_conceded_avg: 1.00
        strength: 0.80
      Atletico Madrid:
        home_win_rate: 0.60
        draw_rate: 0.30
        away_win_rate: 0.10
        goals_scored_avg: 1.50
        goals_conceded_avg: 0.70
        strength: 0.75
  # Ratings Elo (para modelo Elo)
  elo_ratings:
    Real Madrid: 2100
    Barcelona: 2050
    Atletico Madrid: 1950
    Sevilla: 1850

# Decisiones
decision:
  min_arbitrage_percent: 2.0  # % mínimo para considerar surebet
  min_value_threshold: 0.05   # 5% de valor mínimo
  max_stake_percent: 0.10     # 10% del bankroll por apuesta

# Bankroll
bankroll:
  initial: 1000.0
  currency: "EUR"
  max_single_bet: 100.0
  min_single_bet: 10.0

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "quantbet.log"