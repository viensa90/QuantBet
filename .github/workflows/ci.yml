name: CI - Tests y Validación

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
    
    - name: Configurar Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install --with-deps chromium
        pip install flake8 mypy black pytest-cov
    
    - name: Verificar formato con Black
      run: |
        black --check src/ tests/
    
    - name: Verificar linting con flake8
      run: |
        flake8 src/ tests/ --count --max-complexity=10 --statistics
    
    - name: Verificar tipos con mypy
      run: |
        mypy src/ --ignore-missing-imports --no-strict-optional
    
    - name: Ejecutar tests (rápidos)
      run: |
        pytest tests/ -v --cov=src --cov-report=xml --cov-report=html -m "not slow"
    
    - name: Subir cobertura a Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: Guardar artefactos de cobertura
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-${{ matrix.python-version }}
        path: htmlcov/
    
    - name: Verificar cobertura mínima
      run: |
        pip install coverage
        coverage report --fail-under=70

  security:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
    
    - name: Escaneo de seguridad con Bandit
      run: |
        pip install bandit
        bandit -r src/ -f json -o bandit-report.json
      continue-on-error: true
    
    - name: Guardar reporte de seguridad
      uses: actions/upload-artifact@v4
      with:
        name: security-report
        path: bandit-report.json

  build:
    runs-on: ubuntu-latest
    needs: [test]
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
    
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Verificar que main.py funciona
      run: |
        pip install -r requirements.txt
        python main.py --help
        python main.py --stats
    
    - name: Verificar que el dashboard inicia
      run: |
        timeout 10 python main.py --serve &
        sleep 5
        curl -s http://localhost:5000/api/health | grep healthy