arbitrage:
  min_profit_percent: 1.5

pipeline:
  dedup_window_hours: 1   # No mostrar la misma oportunidad si ya apareció en las últimas N horas

odds_api:
  key: ""                         # se llena desde .env
  sports:
    - soccer_epl
    - soccer_spain_la_liga
    - soccer_italy_serie_a
    - soccer_germany_bundesliga
    - soccer_france_ligue_one
    - soccer_netherlands_eredivisie
    - soccer_portugal_primeira_liga
    - soccer_brazil_campeonato_brasileiro
    - soccer_mexico_ligamx
    - soccer_usa_mls
    - soccer_england_efl_championship
    - soccer_uefa_champs_league
  markets: "h2h,totals"
  regions: eu
  allowed_bookmakers:
    - Pinnacle
    - 1xBet
    - BetOnline.ag
    - Betfair
    - Marathonbet
  exclude_live: true               # Ignorar partidos ya comenzados
  min_minutes_to_start: 10         # Solo eventos que empiecen en ≥ 10 minutos