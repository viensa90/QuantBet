name: Tests de Estrés

on:
  schedule:
    # Ejecutar diariamente a las 2:00 AM
    - cron: '0 2 * * *'
  workflow_dispatch:  # Permitir ejecución manual

jobs:
  stress:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
    
    - name: Configurar Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install --with-deps chromium
    
    - name: Ejecutar tests de estrés
      run: |
        pytest tests/test_stress.py -v --run-slow --timeout=300
    
    - name: Guardar resultados de estrés
      uses: actions/upload-artifact@v4
      with:
        name: stress-test-results
        path: |
          quantbet.db
          *.log
    
    - name: Notificar si fallan tests de estrés
      if: failure()
      run: |
        echo "❌ Tests de estrés fallaron" >> $GITHUB_STEP_SUMMARY
        echo "Revisar logs para más detalles" >> $GITHUB_STEP_SUMMARY