# QuantBet Configuration
version: "0.1.0"

# Database
database:
  path: "quantbet.db"

# Decision
decision:
  threshold: 60.0  # Score mínimo para EJECUTAR (antes hardcodeado)

# Scoring
scoring:
  roi_weight: 0.4
  liquidity_weight: 0.3
  confidence_weight: 0.3
  min_roi: 0.0
  max_roi: 10.0

# Bankroll
bankroll:
  total: 1000.0        # Bankroll total en unidades monetarias
  max_exposure: 0.10   # Exposición máxima por apuesta (10%)

# Providers
providers:
  csv:
    path: "data/sample_events.csv"

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "quantbet.log"