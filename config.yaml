# QuantBet - Configuración Centralizada

decision:
  threshold: 60              # Score mínimo para EJECUTAR

bankroll:
  initial_funds: 1000.0      # Fondos iniciales (unidades)
  stake_percentage: 0.10     # 10% del bankroll por apuesta

logging:
  level: INFO                # DEBUG, INFO, WARNING, ERROR
  file: "logs/quantbet.log"  # Ruta del archivo de log
  console: true              # Mostrar en consola

connectors:
  csv:
    path: "data/sample_events.csv"
  playwright:
    sites:
      - name: "example_site"
        url: "https://example-betting-site.com/odds"
        row_selector: "tr.match-row"
        event_selector: "td.event-name"
        odds_selector: "td.odd-value"
        market: "1X2"
        outcomes: ["1", "X", "2"]