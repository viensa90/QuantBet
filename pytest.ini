[pytest]
# Configuración para tests de estrés
markers =
    slow: Pruebas de estrés que pueden ser lentas (1000+ eventos)

# Omitir tests de estrés por defecto (usar --run-slow para ejecutarlos)
addopts = -p no:cacheprovider

# Timeout para tests lentos
timeout = 300

# Verbosidad
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*