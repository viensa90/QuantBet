name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
    
    - name: Configurar Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
    
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install --with-deps chromium
    
    - name: Ejecutar todos los tests
      run: |
        pytest tests/ -v --run-slow
    
    - name: Crear release en GitHub
      uses: softprops/action-gh-release@v1
      with:
        generate_release_notes: true
        files: |
          quantbet.db
          config.yaml
          requirements.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Construir artefacto de distribución
      run: |
        zip -r quantbet-${{ github.ref_name }}.zip src/ data/ main.py config.yaml requirements.txt README.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Subir artefacto a release
      uses: actions/upload-artifact@v4
      with:
        name: quantbet-${{ github.ref_name }}
        path: quantbet-${{ github.ref_name }}.zip