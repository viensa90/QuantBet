# QuantBet - Configuración Centralizada
# Versión: 0.3.1 (Optimización de rendimiento)

version: "0.3.1"

# Estrategias habilitadas
strategies:
  arbitrage: true
  value_betting: true
  dutching: true

# Mercados soportados
markets:
  enabled:
    - "1X2"
    - "Over/Under"
    - "Asian Handicap"
    - "Double Chance"
  over_under_lines: [0.5, 1.5, 2.5, 3.5]
  asian_handicaps: [-1.0, -0.75, -0.5, -0.25, 0.0, 0.25, 0.5, 0.75, 1.0]

# Umbrales y parámetros
thresholds:
  min_profit_percent: 1.5
  min_value_probability: 0.65
  min_dutching_odds: 2.0
  max_risk_per_bet: 0.02  # 2% del bankroll

# Modelo de probabilidad
probability_model:
  type: "historical"  # historical | elo | poisson
  use_team_stats: true
  elo_default_rating: 1500
  poisson_goals_avg: 1.5

# Conectores
connectors:
  csv:
    data_dir: "data/"
    events_file: "sample_events.csv"
    team_stats_file: "team_stats.csv"
  
  web:
    provider: "playwright"
    headless: true
    timeout: 30000
    urls:
      - "https://example.com/odds"
      - "https://example.com/live"

# Base de datos y rendimiento (NUEVO en v0.3.1)
database:
  path: "quantbet.db"
  pool_size: 5
  timeout: 10.0
  cache_size_mb: 20
  journal_mode: "WAL"
  synchronous: "NORMAL"
  cleanup_days: 30

# Dashboard web
web:
  host: "0.0.0.0"
  port: 5000
  debug: true
  refresh_seconds: 30

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "quantbet.log"